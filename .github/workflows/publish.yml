name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'


permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          scope: "@highelflord"

      - name: Check
        run: echo 'everythings works fine2!';
